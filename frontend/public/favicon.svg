<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle inner border accent -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" fill="none" stroke="#60a5fa" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Rupee Symbol Text -->
  <text 
    x="32" 
    y="44" 
    font-family="Inter, system-ui, -apple-system, sans-serif" 
    font-size="38" 
    font-weight="800" 
    fill="url(#glyphGrad)" 
    text-anchor="middle"
    letter-spacing="-1">₹</text>
</svg>
