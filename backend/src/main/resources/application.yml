server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: india-decision-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/indiadecision}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

ai:
  api:
    key: ${AI_API_KEY:${ANTHROPIC_API_KEY:}}
    provider: anthropic
    model: claude-3-haiku-20240307

logging:
  level:
    root: INFO
    com.indiadecision.platform: DEBUG
